<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Text Tone Detector - Detect the tone of your sentence using basic heuristics">
  <title>AI Text Tone Detector</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors">
  <header class="p-4 text-center shadow-md bg-white dark:bg-gray-800">
    <h1 class="text-2xl font-bold">AI Text Tone Detector</h1>
  </header>

  <main class="max-w-2xl mx-auto p-4 mt-6">
    <section class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-md">
      <label for="userInput" class="block font-semibold mb-2">Paste your sentence below:</label>
      <textarea id="userInput" maxlength="300" rows="5"
        class="w-full p-3 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 resize-none"
        placeholder="Type or paste a sentence (max 300 characters)..."></textarea>
      <div class="text-sm mt-1 text-right" id="charCount">0 / 300 characters</div>

      <button id="analyzeBtn"
        class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition disabled:opacity-50"
        disabled>Analyze Tone</button>

      <div id="loadingSpinner" class="hidden mt-4 text-center">
        <svg class="animate-spin h-6 w-6 text-blue-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
        </svg>
      </div>

      <div id="result" class="mt-4 text-lg font-bold text-center"></div>
      <div id="lengthInfo" class="mt-1 text-sm text-center text-gray-600 dark:text-gray-400"></div>
    </section>

    <p class="mt-6 text-yellow-700 bg-yellow-100 dark:bg-yellow-900 dark:text-yellow-200 rounded-md p-3 text-sm">
      ⚠️ This tool uses basic AI heuristics and may not reflect tone accurately. Use results with discretion.
    </p>

    <footer class="mt-8 text-sm text-center text-gray-600 dark:text-gray-400">
      <div id="visitInfo"></div>
    </footer>
  </main>

  <script>
    const textarea = document.getElementById('userInput');
    const charCount = document.getElementById('charCount');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultDiv = document.getElementById('result');
    const lengthInfo = document.getElementById('lengthInfo');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const visitInfo = document.getElementById('visitInfo');

    // Sanitization helper
    function escapeHtml(unsafe) {
      return unsafe.replace(/[&<"'>]/g, function (match) {
        const escape = { '&': '&amp;', '<': '&lt;', '"': '&quot;', "'": '&#039;', '>': '&gt;' };
        return escape[match];
      });
    }

    // Update character count
    textarea.addEventListener('input', () => {
      const len = textarea.value.length;
      charCount.textContent = `${len} / 300 characters`;
      analyzeBtn.disabled = len === 0;
    });

    // Fake tone detection using keyword heuristic
    function detectTone(text) {
      const lcText = text.toLowerCase();
      if (/thank|please|appreciate/.test(lcText)) return 'Formal';
      if (/hey|yo|dude/.test(lcText)) return 'Casual';
      if (/hate|stupid|idiot/.test(lcText)) return 'Rude';
      if (/angry|mad|furious/.test(lcText)) return 'Angry';
      if (/haha|lol|fun/.test(lcText)) return 'Friendly';
      if (/sure|right|whatever/.test(lcText)) return 'Sarcastic';
      return 'Neutral';
    }

    analyzeBtn.addEventListener('click', () => {
      const input = textarea.value.trim();
      if (!input) return;

      const safeInput = escapeHtml(input);
      resultDiv.textContent = '';
      lengthInfo.textContent = '';
      loadingSpinner.classList.remove('hidden');

      setTimeout(() => {
        const tone = detectTone(safeInput);
        resultDiv.textContent = `Detected Tone: ${tone}`;
        lengthInfo.textContent = `Total Characters Analyzed: ${safeInput.length}`;
        loadingSpinner.classList.add('hidden');
      }, 800);
    });

    // Visit tracker
    function updateVisitStats() {
      const now = new Date();
      const lastVisit = localStorage.getItem('lastVisit');
      const visits = parseInt(localStorage.getItem('visitCount') || '0') + 1;
      localStorage.setItem('visitCount', visits);
      localStorage.setItem('lastVisit', now.toString());

      visitInfo.innerHTML = `Total Visits: <strong>${visits}</strong><br>Last Visit: <strong>${lastVisit ? new Date(lastVisit).toLocaleString() : 'First visit'}</strong>`;
    }

    updateVisitStats();
  </script>
</body>

</html>
