<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A comprehensive project cost estimator with currency conversion and social sharing features.">
    <meta name="keywords" content="Cost Estimation, Currency Conversion, Social Sharing, Project Planning">
    <meta name="author" content="Your Name">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Project Cost Estimator">
    <meta property="og:description" content="Estimate project costs, convert currencies, and share insights on social media.">
    <meta property="og:image" content="/path-to-image.jpg">
    <meta property="og:url" content="https://yourdomain.com">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Project Cost Estimator">
    <meta name="twitter:description" content="Estimate project costs and share insights.">
    <meta name="twitter:image" content="/path-to-image.jpg">

    <title>Project Cost Estimator</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @media print {
            button, h2.text-secondary.mb-3:last-of-type { display: none !important; }
        }
        .bordered-section {
            border: 2px solid #6c757d;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-light text-dark">
    <div class="container py-5">
        <h1 class="text-center text-primary mb-5">Project Cost Estimator</h1>

        <button class="btn btn-dark mb-4" onclick="toggleDarkMode()">Toggle Dark Mode</button>

        <!-- Project Details Section -->
        <div class="bordered-section">
            <h2 class="text-secondary mb-3">Project Details</h2>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <input type="text" id="projectName" class="form-control" placeholder="Project Name" maxlength="255">
                </div>
                <div class="col-md-6 mb-3">
                    <textarea id="projectDescription" class="form-control" placeholder="Project Description" maxlength="500"></textarea>
                </div>
                <div class="col-md-6 mb-3">
                    <select id="projectCategory" class="form-select">
                        <option value="">Select Category...</option>
                        <option value="Software Development">Software Development</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Construction">Construction</option>
                        <option value="Consulting">Consulting</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <input type="number" id="projectDuration" class="form-control" placeholder="Duration (weeks)" min="1">
                </div>
            </div>
        </div>

        <!-- Labor Cost Section -->
        <div class="bordered-section">
            <h2 class="text-secondary mb-3">Labor Cost Details</h2>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <input type="number" id="teamMembers" class="form-control" placeholder="Number of Team Members" min="1">
                </div>
                <div class="col-md-4 mb-3">
                    <input type="number" id="hourlyRate" class="form-control" placeholder="Hourly Rate ($)" min="0">
                </div>
                <div class="col-md-4 mb-3">
                    <input type="number" id="hoursPerWeek" class="form-control" placeholder="Hours per Week" min="1" max="168">
                </div>
            </div>
        </div>

        <!-- Material Cost Section -->
        <div class="bordered-section">
            <h2 class="text-secondary mb-3">Material Costs</h2>
            <div id="materialsList"></div>
            <button class="btn btn-success mt-3" onclick="addMaterialRow()">Add Material</button>
        </div>

        <!-- Expense Cost Section -->
        <div class="bordered-section">
            <h2 class="text-secondary mb-3">Other Expenses</h2>
            <div id="expensesList"></div>
            <button class="btn btn-success mt-3" onclick="addExpenseRow()">Add Expense</button>
        </div>

        <!-- Total Cost Table -->
        <div class="bordered-section">
            <h2 class="text-secondary mb-3">Total Cost Breakdown</h2>
            <table class="table table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Cost Type</th>
                        <th>Amount ($)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Labor Cost</td>
                        <td id="laborCostDisplay">0.00</td>
                    </tr>
                    <tr>
                        <td>Material Cost</td>
                        <td id="materialCostDisplay">Nil</td>
                    </tr>
                    <tr>
                        <td>Other Expenses</td>
                        <td id="expenseCostDisplay">Nil</td>
                    </tr>
                    <tr class="fw-bold">
                        <td>Total Cost</td>
                        <td id="totalCostDisplay">0.00</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Final Cost Calculation and Print -->
        <div class="text-center mt-4">
            <button class="btn btn-primary mb-4" onclick="calculateTotalCost()">Calculate Final Cost</button>
            <button class="btn btn-secondary mb-4" onclick="window.print()">Print Estimation</button>
        </div>

        <script>
            function addMaterialRow() {
                const row = document.createElement('div');
                row.className = 'row mb-2';
                row.innerHTML = `
                    <div class="col-md-4 mb-2">
                        <input type="text" class="form-control" placeholder="Material Name">
                    </div>
                    <div class="col-md-4 mb-2">
                        <input type="number" class="form-control" placeholder="Cost per Unit" min="0">
                    </div>
                    <div class="col-md-4 mb-2">
                        <input type="number" class="form-control" placeholder="Quantity" min="1">
                    </div>
                `;
                document.getElementById('materialsList').appendChild(row);
            }

            function addExpenseRow() {
                const row = document.createElement('div');
                row.className = 'row mb-2';
                row.innerHTML = `
                    <div class="col-md-4 mb-2">
                        <input type="text" class="form-control" placeholder="Expense Description">
                    </div>
                    <div class="col-md-4 mb-2">
                        <input type="number" class="form-control" placeholder="Cost" min="0">
                    </div>
                    <div class="col-md-4 mb-2">
                        <input type="number" class="form-control" placeholder="Quantity" min="1">
                    </div>
                `;
                document.getElementById('expensesList').appendChild(row);
            }

            function calculateTotalCost() {
                const laborCost = parseFloat(document.getElementById('hourlyRate').value) * parseFloat(document.getElementById('hoursPerWeek').value) * parseFloat(document.getElementById('teamMembers').value);
                let materialCost = 0;
                document.querySelectorAll('#materialsList > div').forEach(row => {
                    const costPerUnit = parseFloat(row.children[1].children[0].value) || 0;
                    const quantity = parseFloat(row.children[2].children[0].value) || 0;
                    materialCost += costPerUnit * quantity;
                });

                let expenseCost = 0;
                document.querySelectorAll('#expensesList > div').forEach(row => {
                    const costPerUnit = parseFloat(row.children[1].children[0].value) || 0;
                    const quantity = parseFloat(row.children[2].children[0].value) || 0;
                    expenseCost += costPerUnit * quantity;
                });

                const totalCost = laborCost + materialCost + expenseCost;

                document.getElementById('laborCostDisplay').textContent = laborCost.toFixed(2);
                document.getElementById('materialCostDisplay').textContent = materialCost > 0 ? materialCost.toFixed(2) : 'Nil';
                document.getElementById('expenseCostDisplay').textContent = expenseCost > 0 ? expenseCost.toFixed(2) : 'Nil';
                document.getElementById('totalCostDisplay').textContent = totalCost.toFixed(2);
            }

            function toggleDarkMode() {
                document.body.classList.toggle('bg-dark');
                document.body.classList.toggle('text-light');
            }
        </script>
    </div>
</body>
</html>
