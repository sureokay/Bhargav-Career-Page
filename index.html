<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: https://*; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline';">
    <title>Bhargav Desai - QA Professional Portfolio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a237e;
            --secondary-color: #0d47a1;
            --accent-color: #1565c0;
            --text-color: #e3f2fd;
            --section-bg: rgba(13, 71, 161, 0.9);
            --hover-color: #1976d2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            padding: 3rem;
            background: var(--section-bg);
            margin-bottom: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .profile-info {
            margin-bottom: 2rem;
        }

        .profile-info h1 {
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .contact-details {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            transition: transform 0.3s ease;
        }

        .contact-item:hover {
            transform: translateY(-2px);
        }

        .linkedin-profile {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: #0077b5;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            margin-top: 1rem;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .linkedin-profile:hover {
            transform: translateY(-2px);
            background: #005885;
        }

        .search-container {
            margin: 2rem auto;
            max-width: 600px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        .search-container input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
        }

        .search-container input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .experience-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .experience-card {
            background: var(--section-bg);
            border-radius: 15px;
            padding: 2rem;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .experience-card:hover {
            transform: translateY(-5px);
        }

        .experience-card h3 {
            color: #fff;
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        .experience-period {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 1rem;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.4rem 0.8rem;
            border-radius: 15px;
            font-size: 0.85rem;
            transition: background-color 0.3s ease;
        }

        .skill-tag:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .profile-info h1 {
                font-size: 2rem;
            }

            .contact-details {
                flex-direction: column;
                align-items: center;
            }

            .experience-card {
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="profile-info">
                <h1>Bhargav Desai</h1>
                <p>Global Software Quality and Project Consultant</p>
                <div class="contact-details">
                    <div class="contact-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>Nadiad, Gujarat, India</span>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-phone"></i>
                        <span>+91 9265118955</span>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-envelope"></i>
                        <span>desai.bhargav@gmail.com</span>
                    </div>
                </div>
                <a href="https://www.linkedin.com/in/bhargav-desai-43b0ab149/" target="_blank" rel="noopener noreferrer" class="linkedin-profile">
                    <i class="fab fa-linkedin"></i>
                    <span>LinkedIn Profile</span>
                </a>
            </div>
        </header>

        <div class="search-container">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search skills, experiences, or companies..." 
                autocomplete="off"
                aria-label="Search"
            >
        </div>

        <div class="experience-grid" id="experienceContainer">
            <!-- Experiences will be dynamically added here -->
        </div>
    </div>

    <script>
        // Experience data structure
        const experiences = [
            {
                title: "Remote Software Quality Assurance Consultant",
                company: "Self Employed",
                period: "November 2020 - Present",
                description: "Providing remote QA consulting services to clients worldwide.",
                skills: ["JIRA", "Zephyr", "Slack", "Confluence", "Google Suite", "eCommerce Testing", "Web Application Testing"]
            },
            {
                title: "Chief Technology Officer",
                company: "Mangalam Placements Pvt Ltd",
                period: "November 2020 - July 2021",
                description: "Led development and testing of web and mobile applications, implementing innovative features.",
                skills: ["Leadership", "Mobile Testing", "Web Testing", "User Experience", "Team Management", "Strategic Planning"]
            },
            {
                title: "Senior Software Quality Assurance Engineer",
                company: "Skyward Techno Solutions Pvt. Ltd",
                period: "November 2019 - February 2021",
                description: "Oversaw mobile application testing and led test case planning and execution.",
                skills: ["Mobile Testing", "Test Planning", "Quality Metrics", "Process Improvement", "JIRA Integration"]
            },
            {
                title: "Freelance Expert",
                company: "Freelancer",
                period: "March 2011 - November 2019",
                description: "Conducted functional, regression, integration, and automation testing using Selenium.",
                skills: ["Selenium", "BDD", "Cucumber", "Ruby", "JavaScript", "Sikuli", "Nokogiri"]
            },
            {
                title: "Software QA Engineer",
                company: "Musikaar",
                period: "March 2010 - February 2011",
                description: "Developed test cases and managed virtual infrastructure testing.",
                skills: ["Test Case Development", "Virtual Infrastructure", "BAT Reports", "ESXi Servers"]
            },
            {
                title: "Software Test Engineer",
                company: "Indusa",
                period: "September 2008 - February 2010",
                description: "Configured testing procedures and managed testing methodologies.",
                skills: ["SENDMAIL", "POSTFIX", "CLEARQUEST", "Agile Methodology", "Configuration Management"]
            }
        ];

        // Safely escape HTML to prevent XSS
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Create and render experience cards
        function renderExperiences(filteredExperiences = experiences) {
            const container = document.getElementById('experienceContainer');
            container.innerHTML = '';

            filteredExperiences.forEach(exp => {
                const card = document.createElement('div');
                card.className = 'experience-card';
                
                card.innerHTML = `
                    <h3>${escapeHtml(exp.title)}</h3>
                    <div class="experience-period">
                        <i class="far fa-calendar-alt"></i> ${escapeHtml(exp.period)}
                    </div>
                    <p>${escapeHtml(exp.description)}</p>
                    <div class="skills-container">
                        ${exp.skills.map(skill => `<span class="skill-tag">${escapeHtml(skill)}</span>`).join('')}
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // Search functionality
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        const searchContent = debounce((searchTerm) => {
            const normalizedSearchTerm = searchTerm.toLowerCase().trim();
            
            if (!normalizedSearchTerm) {
                renderExperiences();
                return;
            }

            const filteredExperiences = experiences.filter(exp => {
                return exp.title.toLowerCase().includes(normalizedSearchTerm) ||
                       exp.company.toLowerCase().includes(normalizedSearchTerm) ||
                       exp.description.toLowerCase().includes(normalizedSearchTerm) ||
                       exp.skills.some(skill => skill.toLowerCase().includes(normalizedSearchTerm));
            });

            renderExperiences(filteredExperiences);
        }, 300);

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            renderExperiences();
            
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                searchContent(e.target.value);
            });

            // Add basic XSS protection
            searchInput.addEventListener('invalid', (e) => {
                e.preventDefault();
            });
        });
    </script>
</body>
</html>
