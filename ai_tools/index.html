<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI tools list">
  <title>Top 10 Trending AI Tools (2025)</title>
  <style>
    /* Reusing theme from uploaded example.txt */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #2a2a2a;
      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
      --text-muted: #808080;
      --accent-primary: #00d4ff;
      --accent-secondary: #ff6b6b;
      --border-color: #333333;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.4);
      --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 0;
      margin: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    header {
      text-align: center;
      padding: 4rem 0 2rem;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
      border-bottom: 1px solid var(--border-color);
    }
    header h1 {
      font-size: 3rem;
      font-weight: 700;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-top: 1rem;
    }
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-top: 3rem;
    }
    .tool-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      border-radius: 1rem;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease;
      position: relative;
    }
    .tool-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }
    .tool-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--accent-primary);
      margin-bottom: 0.5rem;
    }
    .tool-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }
    .tool-link {
      display: inline-block;
      margin-bottom: 1rem;
      font-weight: 500;
      color: var(--accent-secondary);
      text-decoration: none;
    }
    .tool-link:hover {
      text-decoration: underline;
    }
    .vote-btn {
      background: var(--gradient);
      color: white;
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
    }
    .vote-count {
      font-weight: bold;
      color: var(--accent-primary);
      margin-left: 0.5rem;
    }
    footer {
      text-align: center;
      padding: 2rem;
      background: var(--bg-tertiary);
      border-top: 1px solid var(--border-color);
      font-size: 0.9rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Top 10 Trending AI Tools (2025)</h1>
      <p class="subtitle">Curated list of powerful AI tools you should know — vote your favorite!</p>
    </div>
  </header>

  <main class="container">
    <div class="tool-grid" id="tool-grid">
      <!-- Cards will be injected here by JS -->
    </div>
  </main>

  <footer>
    <p>This list and summaries are <strong>AI-generated</strong> for informational purposes only. Please verify details from official websites.</p>
  </footer>

  <script>
    const tools = [
      { id: 1, name: "ChatGPT", desc: "AI assistant for conversation, writing, and coding.", link: "https://chat.openai.com" },
      { id: 2, name: "Midjourney", desc: "AI image generation from text prompts.", link: "https://www.midjourney.com" },
      { id: 3, name: "Notion AI", desc: "Supercharge your notes with AI summaries and insights.", link: "https://www.notion.so/product/ai" },
      { id: 4, name: "Runway ML", desc: "AI-powered video editing and creative tools.", link: "https://runwayml.com" },
      { id: 5, name: "Perplexity AI", desc: "AI search engine with cited sources.", link: "https://www.perplexity.ai" },
      { id: 6, name: "Claude", desc: "AI assistant by Anthropic focused on helpfulness and safety.", link: "https://www.anthropic.com/index/claude" },
      { id: 7, name: "ElevenLabs", desc: "AI voice synthesis with stunning realism.", link: "https://www.elevenlabs.io" },
      { id: 8, name: "Leonardo AI", desc: "Image generation platform with fine-tuned control.", link: "https://leonardo.ai" },
      { id: 9, name: "Poe", desc: "Explore multiple AI chat models in one place.", link: "https://poe.com" },
      { id: 10, name: "Descript", desc: "Edit video/audio as easily as a doc — with AI.", link: "https://www.descript.com" },
    ];

    function getVotes(id) {
      return parseInt(localStorage.getItem(`votes_${id}`) || '0');
    }

    function setVotes(id, count) {
      localStorage.setItem(`votes_${id}`, count);
    }

    function renderTools() {
      const grid = document.getElementById('tool-grid');
      tools.forEach(tool => {
        const card = document.createElement('div');
        card.className = 'tool-card';
        const voteCount = getVotes(tool.id);

        card.innerHTML = `
          <div class="tool-title">${tool.name}</div>
          <div class="tool-desc">${tool.desc}</div>
          <a class="tool-link" href="${tool.link}" target="_blank" rel="noopener noreferrer">Visit Site</a>
          <button class="vote-btn" onclick="upvote(${tool.id})">
            Upvote <span class="vote-count" id="vote-${tool.id}">${voteCount}</span>
          </button>
        `;

        grid.appendChild(card);
      });
    }

    function upvote(id) {
      const current = getVotes(id);
      const updated = current + 1;
      setVotes(id, updated);
      document.getElementById(`vote-${id}`).textContent = updated;
    }

    document.addEventListener('DOMContentLoaded', renderTools);
  </script>
</body>
</html>
