            }

        let currentCategory = 'all';
        let searchTerm = '';

        // Function to update navigation active states
        function updateNavigation(category) {
            // Remove all active classes
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.classList.remove('active');
            });
            
            // Add active class to current category
            if (category !== 'all') {
                document.getElementById(`nav-${category.toLowerCase()}`).classList.add('active');
            }
        }

        // Function to filter prompts by category and search term
        function filterPrompts(category) {
            currentCategory = category;
            const categoryText = category === 'all' ? 'All Prompts' : `${category} Prompts`;
            document.getElementById('currentCategory').textContent = categoryText;
            
            updateNavigation(category);
            
            let filteredPrompts = prompts;
            
            // Apply category filter
            if (category !== 'all') {
                filteredPrompts = prompts.filter(prompt => 
                    prompt.category.toLowerCase() === category.toLowerCase()
                );
            }
            
            // Apply search filter
            if (searchTerm) {
                filteredPrompts = filteredPrompts.filter(prompt =>
                    prompt.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    prompt.description.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    prompt.category.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }
            
            renderPrompts(filteredPrompts);
        }

        // Function to render prompts
        function renderPrompts(promptsToRender) {
            const grid = document.getElementById('promptsGrid');
            if (promptsToRender.length === 0) {
                grid.innerHTML = '<p>No prompts found matching your criteria.</p>';
                return;
            }
            
            grid.innerHTML = promptsToRender.map(prompt => `
                <div class="prompt-card">
                    <div class="prompt-category">${prompt.category}</div>
                    <h2 class="prompt-title">${prompt.title}</h2>
                    <p>${prompt.description}</p>
                </div>
            `).join('');
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            filterPrompts(currentCategory);
        });

        // Initial render
        filterPrompts('all');
